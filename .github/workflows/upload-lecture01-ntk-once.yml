name: Verify published lecture 1 PDF
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/upload-lecture01-ntk-once.yml'
permissions: {}
jobs:
  verify-published-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Check public PDF against the approved local file
        run: |
          python - <<'PY'
          import hashlib, time, urllib.request
          expected = 'e48d2a4437ae8d26c3a4f01202ab9a5fc735db606fb88fea907b0b61dbc0662c'
          url = 'https://2prime.github.io/files/2026-ML-Theory-Seminar/lecture01-notes.pdf'
          deadline = time.monotonic() + 330
          while time.monotonic() < deadline:
              try:
                  request = urllib.request.Request(url, headers={'Cache-Control': 'no-cache', 'User-Agent': 'Lecture-PDF-Verification'})
                  with urllib.request.urlopen(request, timeout=30) as response:
                      data = response.read(2000000)
                      status = response.status
                  digest = hashlib.sha256(data).hexdigest()
                  if status == 200 and len(data) == 1173305 and digest == expected:
                      print('ONLINE_PDF_VERIFIED')
                      print('URL=' + url)
                      print('HTTP_STATUS=' + str(status))
                      print('BYTES=' + str(len(data)))
                      print('SHA256=' + digest)
                      break
                  print('Waiting for Pages deployment: bytes=' + str(len(data)) + ' sha256=' + digest)
              except Exception as exc:
                  print('Waiting for Pages deployment: ' + type(exc).__name__)
              time.sleep(10)
          else:
              raise SystemExit('The public PDF did not match the approved file before timeout')
          PY
