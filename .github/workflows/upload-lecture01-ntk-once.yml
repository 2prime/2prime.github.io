name: Stage verified lecture 1 PDF
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/upload-lecture01-ntk-once.yml'
permissions:
  contents: write
jobs:
  stage-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify PDF and store its Git blob
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PDF_URL: 'https://sdmntprwestus3.oaiusercontent.com/files/00000000-ce04-81fd-ad7c-d92187f62846/raw?se=2026-10-19T09%3A30%3A41Z&sp=r&sv=2026-02-06&sr=b&scid=b32599e1-defe-51e8-8918-45c2672f5b9a&skoid=b9a47e8b-72a2-4ed3-8028-a2a98c1a6142&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-19T06%3A23%3A39Z&ske=2026-10-20T06%3A23%3A39Z&sks=b&skv=2026-02-06&sig=5nXZED4HFkcpM8lxkYaWOnQSUvxqo/xk8EGtpLA4uWo%3D'
        run: |
          python - <<'PY'
          import base64, hashlib, json, os, urllib.request
          with urllib.request.urlopen(os.environ['PDF_URL'], timeout=90) as response:
              data = response.read(2000000)
          expected = 'e48d2a4437ae8d26c3a4f01202ab9a5fc735db606fb88fea907b0b61dbc0662c'
          assert len(data) == 1173305, 'Unexpected PDF size'
          assert data.startswith(b'%PDF'), 'Not a PDF'
          assert hashlib.sha256(data).hexdigest() == expected, 'PDF digest mismatch'
          payload = json.dumps({'content': base64.b64encode(data).decode('ascii'), 'encoding': 'base64'}).encode('utf-8')
          request = urllib.request.Request('https://api.github.com/repos/' + os.environ['GH_REPO'] + '/git/blobs', data=payload, method='POST', headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28'})
          with urllib.request.urlopen(request, timeout=90) as response:
              result = json.load(response)
          assert result['sha'] == '0b98b8393deb75d9f3e1f24146d0edf1f5f0f333', 'Git blob mismatch'
          print('PDF_VERIFIED size=' + str(len(data)) + ' sha256=' + expected)
          print('PDF_BLOB_SHA=' + result['sha'])
          PY
