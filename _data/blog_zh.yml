"Your draft stays in this browser. Publishing opens GitHub, where you sign in and confirm the commit.": "草稿保存在当前浏览器。发布时会打开 GitHub，由你登录并确认提交。"
"Inline math: use two dollar signs on each side. For a displayed equation, put the dollar signs on their own lines.": "行内公式两侧各用两个美元符号；独立公式把两侧的美元符号分别放在单独一行。"
