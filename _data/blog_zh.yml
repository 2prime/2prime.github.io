"Images, links, lists, tables, and fenced code blocks use standard Markdown.": "图片、链接、列表、表格和代码块均使用标准 Markdown。"
"The exported file includes the title, date, summary, and tags. Add it to the _posts folder to publish.": "导出的文件包含标题、日期、摘要和标签，放入 _posts 文件夹即可发布。"
