  "Fall 2026": "2026 年秋季",
  "This seminar explores generalization, generative modeling, reasoning, post training, scaling laws, and optimization. We study the mathematical questions behind machine learning phenomena and how theory can inform algorithm design. Reading and discussion aim to build a coherent view of a research area and identify questions for further work.": "本讨论班围绕泛化、生成、推理、后训练、规模定律与优化，关注机器学习现象背后的数学问题，以及理论如何帮助改进算法。通过文献阅读与专题讨论，建立对研究方向的整体认识，并寻找值得继续研究的问题。",
  "Full syllabus · PDF, 20 pages": "完整 Syllabus · PDF，20 页",
