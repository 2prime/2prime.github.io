  "Both PDFs are in Chinese.": "两份资料均为中文。",
  "Lecture 1 · Foundations of Machine Learning Theory": "第一讲 · 机器学习理论基础",
  "Monday, 12 October 2026": "2026 年 10 月 12 日（周一）",
