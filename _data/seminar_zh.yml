  "Room 225, Siyuan Hall (四元厅)": "四元厅 225",
  "Speaker: Yiping Lu": "主讲：陆一平",
  "How can finite data reveal an unknown function? We begin with risk decomposition, examine the difficulty of approximation in high dimensions, and develop tools for concentration and generalization. Mean estimation, localized complexity, and kernel methods then show how a more precise analysis improves statistical guarantees. Proofs emphasize the purpose of each step, the key transformation, and the passage from intuition to a rigorous argument.": "怎样用有限数据学到一个未知函数？本讲从风险分解出发，依次讨论高维逼近的困难、随机波动与泛化控制，再用均值估计、局部复杂度和核方法说明更精细的统计分析如何产生。证明着重解释为什么需要每一步、关键变换是什么，以及直觉怎样成为严格论证。",
  "Lecture outline": "内容大纲",
  "Risk decomposition: identifying the sources of error": "风险分解：先弄清误差从哪里来",
  "Distinguish population risk from empirical risk, separate approximation limitations from estimation error, and locate optimization error within an empirical risk minimization bound.": "区分总体风险与经验风险，把模型的逼近限制和有限数据的估计代价分开，并明确优化误差如何进入经验风险最小化的上界。",
  "Population risk, empirical risk, and excess risk under squared loss; Risk decomposition and the basic ERM comparison; How risk decomposition differs from the decomposition into bias and variance.": "总体风险、经验风险与平方损失下的超额风险；Risk decomposition 与 ERM 的基本比较；风险分解和偏差方差分解的区别。",
  "The curse of dimensionality: corners, distances, and approximation": "维数灾难：角区、随机距离与网格逼近",
  "Use a cube and its inscribed ball to understand why volume moves away from the central region. Then study normalized random distances as sums of coordinate contributions and connect this geometry to approximation of smooth functions.": "从立方体的顶点与内切球出发，解释体积为什么逐渐离开中央区域；再由独立坐标的累积说明归一化随机距离的集中，并连接平滑函数的逼近复杂度。",
  "2ᵈ vertices and regions outside the inscribed ball: counting versus volume; Distance concentration for random vertices and continuous random points; Grid counting, local polynomials, and the role of smoothness.": "2ᵈ 个顶点与内切球外的角区：计数和体积的不同含义；随机顶点与连续随机点的距离集中；网格计数、局部多项式与平滑度对维数依赖的影响。",
  "Concentration inequalities: from moments to exponential tails": "集中不等式：从矩走向指数尾",
  "Follow a single proof strategy based on adjustable transformations, moving from low moments to exponential moments. Understand how independence turns bounds for individual variables into concentration of sample averages.": "沿着可调变换这一条证明主线，从低阶矩逐步走到指数矩，理解独立性如何把单个变量的控制变成样本平均的集中。",
  "Markov → Chebyshev → higher moments → moment generating functions and Chernoff bounds; Independent sums, subgaussian bounds, and Hoeffding's inequality; How Bernstein's inequality retains variance information.": "Markov → Chebyshev → 高阶矩 → MGF 与 Chernoff 方法；独立和、次高斯控制与 Hoeffding 不等式；Bernstein 不等式如何保留方差信息。",
  "Generalization: controlling an entire function class": "泛化控制：从一个函数到整个函数类",
  "A learner selects a function using the data, so a bound for one fixed function is insufficient. Coverings, random signs, and random sparsification provide complementary ways to measure the size of a class.": "学习器会根据数据选择函数，因此需要同时控制整类候选。通过覆盖、随机符号和随机稀疏化，比较几种刻画函数类大小的方法。",
  "Uniform bounds, union bounds, and covering numbers; Rademacher complexity, symmetrization, and contraction for losses; Maurey's empirical method: constructing covers by random sparsification.": "Uniform bounds、并集界与 covering number；Rademacher complexity、对称化与损失的 contraction；Maurey 的 empirical method：用随机稀疏化构造覆盖。",
  "Localized complexity: seeing curvature through mean estimation": "局部复杂度：均值估计怎样揭示曲率的作用",
  "Compare a global complexity bound with the explicit solution of the same mean estimation problem. Express the excess loss under squared loss as a quadratic cost plus a random linear perturbation, then retain the shrinking local fluctuations to recover the correct rate.": "对同一个均值估计问题，比较全局复杂度界与显式解。把平方损失的超额损失写成二次代价加随机线性扰动，再用随半径缩小的局部波动恢复正确的统计速率。",
  "Parameter error: the global bound gives": "参数误差：全局界给出",
  "; the explicit solution and local analysis give": "；显式解与局部分析给出",
  "Mean estimation as an example of a loose global bound; Curvature of squared loss, local variance, and the ERM basic inequality; The intuition behind a critical radius and a return to the mean example.": "均值估计例子：全局界为什么会损失精度；平方损失的曲率、局部方差与 ERM 基本不等式；临界半径的直觉，以及局部分析如何回到均值例子。",
  "Kernel smoothing: estimating a function from nearby data": "核平滑：用附近的数据估计未知函数",
  "View nonparametric regression as local averaging. Separate smoothing bias from the noise due to a finite number of nearby observations, and relate bandwidth selection to dimension.": "把非参数回归理解为局部平均，分别计算平滑带来的逼近偏差和邻域内有限样本带来的随机误差，解释带宽选择与维数的关系。",
  "Local averages, neighborhood sample counts, and random denominators; Balancing bandwidth dependent bias and variance; Smoothness, dimension, and rates of nonparametric estimation.": "局部平均、邻域样本数与随机分母；带宽对应的偏差和方差平衡；平滑度、维数与非参数估计的收敛速率。",
  "RKHS: from nonlinear features to function space geometry": "RKHS：从非线性特征到函数空间几何",
  "Start with nonlinear features and the dual of ridge regression to derive predictions that depend only on inner products. Transfer the parameter norm to a space of functions to motivate the reproducing property, the representer theorem, and kernel ridge regression.": "先从非线性特征和岭回归的对偶推导出只依赖内积的预测公式，再把参数范数搬到函数空间，说明再生性质、表示定理和核岭回归为什么自然出现。",
  "Feature maps, ridge regression duality, and the computational motivation for kernels; Continuous point evaluation, the reproducing property, and concrete kernels; The representer theorem, kernel ridge regression, and spectral shrinkage.": "特征提升、岭回归对偶与核的计算动机；点值连续、再生性质与具体核的例子；表示定理、核岭回归与谱收缩的统计含义。",
  "Seminar topics": "讨论班专题",
  "Learning theory provides a common foundation for two main tracks, diffusion models and language models, with shared topics in scaling laws and optimization. The following routes guide reading and topic selection.": "以机器学习理论为共同基础，沿扩散模型和语言模型两条主线展开，并共同讨论规模定律与优化。以下内容提供阅读路线与选题方向。",
  "Learning Theory and Generalization": "机器学习理论与泛化",
  "Common foundation": "共同基础",
  "Study generalization in overparameterized models through approximation, statistical, and optimization error, connecting RKHS, kernel regression, neural tangent kernels, and feature learning.": "从逼近、统计与优化误差理解过参数化模型的泛化，联系 RKHS、核回归、神经切线核与特征学习。",
  "Begin with random labels and lazy training, connect kernel spectra to compute optimal scaling, and continue to mean field training and effective dynamics of high dimensional SGD.": "从随机标签实验与惰性训练出发，联系核谱与计算最优规模定律，再进入平均场训练和高维 SGD 的有效动力学。",
  "Diffusion Models": "扩散模型",
  "Main track": "主线",
  "Starting from distributional geometry and sampling, study training, generalization, and inference time adaptation in continuous and discrete diffusion models, distinguishing estimation, discretization, and particle approximation errors.": "从分布空间几何与采样基础出发，研究连续和离散扩散的训练、泛化与推理侧适配，区分估计、离散化和粒子近似误差。",
  "Wasserstein geometry and gradient flows; sampling algorithms and complexity; training and generalization; discrete diffusion; inference time guidance and particle methods.": "Wasserstein 空间与梯度流；采样算法与复杂度；训练理论与泛化；离散扩散；推理侧引导与粒子方法。",
  "Language Models": "语言模型",
  "Study training dynamics and internal mechanisms, in context learning and reasoning, inference time scaling, and post training. Distinguish expressivity, learnability through training, causal mechanisms, and statistical generalization.": "从训练动力学与内部机制出发，研究上下文学习、推理、推理侧扩展与后训练，区分表达能力、训练可学习性、因果机制和统计泛化。",
  "Training dynamics and interpretability; theories of in context learning and reasoning; inference time scaling and verification; preference learning, self improvement, online exploration, and curriculum learning.": "训练动力学与可解释性；上下文学习与推理理论；推理侧扩展与验证；偏好学习、自我改进、在线探索与课程学习。",
  "Scaling Laws of Neural Networks and Data": "神经网络与数据的规模定律",
  "Shared topic": "共享专题",
  "Examine how model size, data, and compute budgets affect performance, alongside stochastic limits of networks, conditional language entropy, long range dependence, ambiguity, and the tails of synthetic data.": "研究模型、数据与计算预算如何影响性能，并讨论网络的随机极限以及语言条件熵、长程相关、数据歧义和合成数据的尾部结构。",
  "Move from empirical scaling laws and compute allocation to kernel spectra and solvable models, then study width and depth limits of networks and the statistical structure of data.": "从经验规模定律与计算分配进入核谱和可解模型，再分别研究网络的宽度与深度极限，以及数据统计结构。",
  "Neural Network Optimizers": "神经网络优化器",
  "Understand Adafactor, Shampoo, SOAP, and Muon through matrix preconditioning and optimization geometry, comparing convergence conditions, compute and memory costs, implicit bias, width scaling, and hyperparameter transfer.": "从矩阵预条件与优化几何理解 Adafactor、Shampoo、SOAP 和 Muon，比较收敛条件、计算与存储成本、隐式偏置、宽度缩放和超参数迁移。",
  "Adafactor and matrix preconditioning; SOAP and Muon; optimization geometry and implicit bias; width scaling and hyperparameter transfer.": "Adafactor 与矩阵预条件；SOAP 与 Muon；优化几何与隐式偏置；宽度缩放和超参数迁移。",
  "The reading list is a starting point for choosing a topic. Participants should seek additional literature around their interests and discuss questions, related papers, and new ideas during preparation. The full syllabus contains the complete reading list, suggested selections, and discussion questions.": "参考阅读是选题的起点。请围绕自己的兴趣继续查找文献，选择问题重要、值得深入理解的工作，并在阅读过程中交流问题、相关论文与新的想法。完整论文列表、选读建议与讨论问题见 Syllabus。",
  "How the seminar works": "组织与报告准备",
  "Background and format": "先修背景与组织形式",
  "A background in probability, linear algebra, mathematical analysis, and machine learning is recommended. Additional prerequisites can be developed as needed for the chosen topic.": "建议具备概率论、线性代数、数学分析和机器学习基础；专题所需的进一步知识可随选题补充。",
  "Yiping Lu will lead the introductory sessions. Subsequent meetings center on student presentations and group discussion. Participants are encouraged to prepare a presentation on one research direction; topics and presentation order will reflect participants’ interests and connections between subjects.": "基础导读由陆一平主讲，随后以学生专题报告和共同讨论为主。鼓励每位参与者围绕一个研究方向准备一次报告，专题与报告顺序结合参与者兴趣及选题之间的联系确定。",
  "Times, rooms, and presentation order for later meetings will be announced as topics are arranged.": "后续场次的时间、地点与报告顺序将结合选题安排另行通知。",
  "Preparing a presentation": "报告准备",
  "Discuss the topic and main papers with Yiping Lu in advance. Aim to study two or three main papers closely alongside four or five related papers; a larger topic may span several presentations. Share paper links and a short reading guide before the presentation, and confirm its scope.": "选题和主讲论文应提前与陆一平讨论。建议精读两至三篇主论文，并对照阅读四至五篇相关论文；较大的主题可拆成连续几次报告。报告前分享论文链接与简短导读，并确认报告范围。",
  "Question and motivation: explain the phenomenon, research question, and why it matters.": "问题与背景：说明要解释的现象、研究问题及其重要性。",
  "Research context: connect the main papers to related work and explain their approaches and contributions.": "文献脉络：联系主论文与相关工作，说明各自的思路及主要进展。",
  "Results and assumptions: specify the setting, error criteria, and complexity dependence, distinguishing theorems, approximate analyses, and empirical observations.": "结论与假设：列明问题设定、误差指标和复杂度依赖，区分严格定理、近似分析与实验观察。",
  "Core method: explain a key proof, algorithmic construction, or experimental design.": "核心方法：讲清一个关键证明、算法构造或实验设计。",
  "Limitations and next questions: examine the assumptions and comparisons, and propose a concrete question for further investigation.": "局限与后续问题：审视假设与比较方式，提出一个可验证或继续研究的具体问题。",
  "Participants may also suggest topics for introductory presentations by Yiping Lu, including applied probability, stochastic simulation and sampling, scientific machine learning, inference algorithms, and neural network optimizers.": "也欢迎提出希望陆一平介绍的专题，包括应用概率、随机模拟与采样、科学机器学习、推理侧算法和神经网络优化器等。",
  "Discuss a topic with Yiping Lu:": "选题交流：",
  "Materials and further reading": "资料与延伸阅读",
  "Seminar overview, presentation guidance, reading routes, and the complete bibliography.": "讨论班介绍、报告准备建议、专题阅读路线与完整参考文献。",
  "The complete first lecture notes, with motivating examples, geometric figures, theorem statements, and proofs that explain the key ideas.": "第一讲完整讲义，包含动机例子、几何图示、定理与突出直觉的证明。",
  "Reference course: Statistical Learning (IEMS 402)": "参考课程：Statistical Learning（IEMS 402）",
  "Optional technical reading in the notes": "讲义中的技术延伸阅读",
  "The notes include complete proofs. The following technical developments are intended for further reading after the main ideas of the lecture.": "讲义保留完整证明。以下技术推导供课后阅读，可在掌握各部分的核心直觉后继续展开。",
  "Chaining and coverings at multiple scales": "Chaining 与多尺度覆盖",
  "The full probabilistic argument for critical radii and local spectral analysis in RKHS": "临界半径的完整概率证明与 RKHS 局部谱分析",
  "Nonparametric minimax lower bounds from localized bump functions": "从局部小凸起构造非参数统计的极小极大下界",
  "Detailed derivations of Gaussian concentration, Green functions, and the space induced by a positive semidefinite kernel": "高斯集中不等式、Green 函数与半正定核空间构造的完整推导",
  "A reading seminar on learning theory, diffusion models, and language models, with shared topics in scaling laws and neural network optimization.": "围绕学习理论、扩散模型与语言模型开展专题阅读与讨论，兼及规模定律和神经网络优化。",
  "First meeting: 12 October, 18:40 to 20:30 · Siyuan Hall 225.": "第一讲：10 月 12 日，18:40 至 20:30 · 四元厅 225。"
