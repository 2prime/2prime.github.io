  "Unbiased derivative free inference time scaling for diffusion models through sequential Monte Carlo on path measures.": "通过路径测度上的序贯蒙特卡洛，实现扩散模型无偏且无需导数的推理时扩展。",
  "A theory of when approximate reward models reduce the complexity of long-horizon LLM reasoning from exponential to polynomial through SMC inference-time scaling.": "刻画近似奖励模型何时能通过序贯蒙特卡洛推理时扩展，将大语言模型长时程推理的复杂度由指数级降至多项式级。",
  "Inference time defect correction improves high dimensional PDE solvers without retraining the learned model.": "在推理阶段利用缺陷校正提升高维偏微分方程求解精度，无需重新训练模型。",
  "Learns differential operators and nonlinear dynamics through constrained convolution filters to identify PDEs from observed data.": "通过受约束的卷积滤波器学习微分算子与非线性动力学，从观测数据中识别偏微分方程。",
  "Combines learnable differential operators with symbolic neural networks to recover explicit PDE models and predict their dynamics.": "结合可学习的微分算子与符号神经网络，恢复显式偏微分方程模型并预测其动力学。",
  "Establishes sharp generalization bounds and minimax rates for PINNs and a modified Deep Ritz method in a prototype elliptic PDE setting.": "在典型椭圆型偏微分方程问题中，为物理信息神经网络与修正的 Deep Ritz 方法建立精确的泛化界和极小极大速率。",
  "Develops minimax optimal rates and a multilevel algorithm for learning linear operators between infinite dimensional function spaces.": "针对无限维函数空间之间的线性算子学习，建立极小极大最优速率并设计多层算法。",
  "Matrix operator norm geometry explains width scaling, row and column normalization, and hyperparameter transfer.": "利用矩阵算子范数几何解释宽度扩展、行列归一化与超参数迁移。",
  "Heavy tailed risk and high dimensional large deviations reveal failure modes hidden by benign average case behavior.": "通过重尾风险与高维大偏差，揭示良好平均表现所掩盖的失效模式。",
  "Studies neural collapse through the implicit bias of gradient flow and the optimization geometry of an unconstrained model of features and classifiers.": "通过梯度流的隐式偏置，以及无约束特征与分类器模型的优化几何，研究神经坍塌现象。",
  "Uniqueness in the Harrison–Reiman class and a completely S class obstruction for a longstanding problem in reflected Brownian motion.": "针对反射布朗运动中的长期问题，证明 Harrison–Reiman 类中的唯一性，并构造完全 S 类中的障碍。",
  "Interprets neural architectures as numerical discretizations of differential equations and uses linear multistep methods to design more efficient residual networks.": "将神经网络架构理解为微分方程的数值离散，并利用线性多步方法设计更高效的残差网络。",
  "Formulates adversarial training as a differential game and uses Pontryagin’s maximum principle to reduce repeated propagation through the full network.": "将对抗训练表述为微分博弈，并利用庞特里亚金最大值原理减少整个网络的重复传播。",
  "Develops a continuum model of deep residual networks and establishes optimization guarantees through mean field analysis and overparameterization from depth.": "建立深层残差网络的连续模型，通过平均场分析与深度过参数化给出优化保证。",
