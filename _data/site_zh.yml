  "01 · Research": "01 · 研究",
  "Structure makes scaling possible.": "以结构支撑规模扩展。",
  "I study when more data, model capacity, optimization effort, or inference computation can be converted into predictable improvements. The common language is mathematics: differential equations, stochastic processes, control, geometry, and randomization.": "我研究何时能够将更多数据、更大模型、更多优化投入或推理计算转化为可预测的提升。贯穿其中的共同语言是数学：微分方程、随机过程、控制、几何与随机化。",
  "The scaling lens": "从规模扩展看问题",
  "One question, several computational worlds": "一个核心问题，多种计算场景",
  "Why do some models scale while others stall?": "为什么有些模型能够扩展，而另一些停滞不前？",
  "Scaling fails when approximation, optimization, statistical uncertainty, or simulation error becomes the hidden bottleneck. I aim to identify that bottleneck mathematically and redesign the algorithm so that added resources improve the quantity we actually care about.": "当逼近、优化、统计不确定性或模拟误差成为隐性瓶颈时，规模扩展就会失效。我希望用数学识别这些瓶颈，并重新设计算法，使新增资源改善我们真正关心的指标。",
  "What should be preserved?": "哪些结构应当保留？",
  "Physical laws, operator geometry, stochastic dynamics, and algebraic identities are not auxiliary information. They determine the representation, metric, and estimator. Preserving them often turns an unstable black box into a controllable computational method.": "物理定律、算子几何、随机动力学与代数恒等式并非辅助信息。它们决定表示、度量与估计量。保留这些结构，往往能将不稳定的黑箱转化为可控的计算方法。",
  "How should theory meet computation?": "理论如何与计算结合？",
  "The objective is not a bound in isolation. A useful theory should identify the right algorithm, predict its scaling behavior, and survive high dimensional experiments. This loop connects my work in machine learning, numerical analysis, and probability.": "目标并不是孤立的误差界。有用的理论应能指导算法选择、预测规模扩展行为，并经受高维实验的检验。这一过程连接了我在机器学习、数值分析与概率方面的研究。",
  "Direction 01": "方向 01",
  "Direction 02": "方向 02",
  "Direction 03": "方向 03",
  "Direction 04": "方向 04",
  "Direction 05": "方向 05",
  "Trading computation for reliability after training": "训练完成后，以计算换取可靠性",
  "Can a fixed generative model become more accurate simply by spending more computation at inference time? I approach this through sequential Monte Carlo, importance sampling, stochastic control, data assimilation, and reward twisting. The goal is to make additional computation reduce error in a measurable and theoretically controlled way.": "对于固定的生成模型，仅增加推理阶段的计算量，能否提升精度？我通过序贯蒙特卡洛、重要性采样、随机控制、数据同化与奖励倾斜研究这一问题，目标是让额外计算以可量化且有理论保证的方式降低误差。",
  "URGE · Path space SMC": "URGE · 路径空间序贯蒙特卡洛",
  "SURGE · Data assimilation": "SURGE · 数据同化",
  "Approximate reward models": "近似奖励模型",
  "Scientific inference as a second scaling axis": "科学推理：另一条扩展计算的路径",
  "For PDE and inverse problems, a learned approximation can be calibrated through simulation without retraining. The resulting defect equation turns model error into a new computational target and gives an end to end relation between extra simulation and improved accuracy.": "对于偏微分方程与反问题，已学习的近似解可以通过模拟校准，无需重新训练。由此得到的缺陷方程将模型误差转化为新的计算目标，并建立额外模拟与精度提升之间的端到端关系。",
  "Simulation Calibrated Scientific ML": "模拟校准的科学机器学习",
  "Slides": "幻灯片",
  "Learning functions and operators with the right notion of error": "以合适的误差度量学习函数与算子",
  "Scientific learning problems are infinite dimensional. Their optimal algorithms depend on the geometry of function spaces, regularity, multilevel structure, and the downstream quantity of interest. My work develops minimax theory and algorithms for PDE solution learning and operator learning.": "科学学习问题具有无限维特征。其最优算法取决于函数空间几何、正则性、多层结构及下游关心的量。我的工作为偏微分方程解学习与算子学习发展极小极大理论和算法。",
  "Learning elliptic PDEs": "椭圆型偏微分方程学习",
  "Multilevel operator learning": "多层算子学习",
  "Sobolev acceleration": "Sobolev 加速",
  "Discovering governing equations from data": "从数据中发现控制方程",
  "PDE Net learns differential operators as constrained convolution filters, combining numerical structure with data to identify governing equations. PDE Net 2.0 adds a symbolic network to recover nonlinear PDE expressions from observed dynamics.": "PDE Net 将微分算子表示为受约束的卷积滤波器，结合数值结构与数据识别控制方程。PDE Net 2.0 进一步引入符号网络，从观测动力学中恢复非线性偏微分方程的显式表达。",
  "Uncertainty quantification and debiasing": "不确定性量化与去偏",
  "Learned surrogates are useful only when their error can be detected and corrected. I combine approximation with Monte Carlo, control variates, and orthogonal bootstrap ideas to obtain statistically efficient scientific estimators.": "学习得到的代理模型只有在误差可检测、可修正时才真正有用。我将逼近与蒙特卡洛、控制变量及正交自助法结合，构造统计高效的科学计算估计量。",
  "Regression adjusted control variates": "回归调整的控制变量",
  "Debiasing and preconditioning": "去偏与预条件",
  "Geometry that survives width and depth": "适应宽度与深度扩展的几何",
  "Standard Euclidean smoothness often grows with model size and cannot explain learning rate transfer. I study steepest descent under matrix operator norms and depth aware function space metrics to design optimizers with stable scaling laws.": "标准欧氏光滑性常随模型规模增长，无法解释学习率迁移。我研究矩阵算子范数与考虑深度的函数空间度量下的最速下降，以设计具有稳定尺度规律的优化器。",
  "Matrix operator geometry": "矩阵算子几何",
  "MOGA slides": "优化器研究幻灯片",
  "Dimension dependence of neural optimizers": "神经网络优化器的维度依赖",
  "Feature geometry and neural collapse": "特征几何与神经坍塌",
  "I study the implicit bias of gradient flow through an unconstrained model of final layer features and classifiers. The analysis links neural collapse to a minimum norm separation problem and characterizes the associated optimization landscape.": "我通过末层特征与分类器的无约束模型研究梯度流的隐式偏置，将神经坍塌与最小范数分离问题联系起来，并刻画相应的优化景观。",
  "Neural collapse · ICLR 2022": "神经坍塌 · ICLR 2022",
  "Reliable randomized numerical algorithms": "可靠的随机化数值算法",
  "Randomization accelerates matrix computation, but accuracy alone is not enough. My work asks when randomized solvers are backward stable, how sketching interacts with preconditioning, and how spectral structure controls convergence.": "随机化能够加速矩阵计算，但仅有精度还不够。我的研究关注随机化求解器何时具有后向稳定性、草图与预条件如何相互作用，以及谱结构如何控制收敛。",
  "Sketch and precondition": "草图与预条件",
  "Randomized iterative refinement": "随机化迭代精化",
  "Making mathematical structure searchable": "让数学结构可被搜索",
  "AI systems are most useful for mathematics when the problem is represented in a form that supports exact search, verification, and compositional reuse. I study how apparently analytic or probabilistic arguments can be converted into algebraic objects and correction circuits.": "当问题表示能够支持精确搜索、验证与组合复用时，人工智能系统对数学最有帮助。我研究如何将表面上属于分析或概率的论证转化为代数对象与校正电路。",
  "AI assisted discovery with proof responsibility": "人工智能辅助发现与严格证明",
  "The signed basic adjoint relationship problem illustrates the workflow: use AI to explore transformations and counterexamples, isolate an invariant algebraic mechanism, and then turn it into a human verifiable theorem with a precisely stated boundary of validity.": "有符号基本伴随关系问题展示了这一过程：利用人工智能探索变换与反例，提炼不变的代数机制，再将其转化为人类可核验、适用边界明确的定理。",
  "Signed BAR paper": "有符号 BAR 猜想论文",
  "Numerical methods for architecture design": "利用数值方法设计网络架构",
  "Neural networks can be interpreted as numerical discretizations of differential equations. Our work uses this connection to design linear multistep architectures and to explain their behavior through modified equations.": "神经网络可以理解为微分方程的数值离散。我们利用这一联系设计线性多步架构，并通过修正方程解释其行为。",
  "Neural differential equations": "神经微分方程",
  "Optimal control for efficient adversarial training": "利用最优控制实现高效对抗训练",
  "YOPO formulates adversarial training as a differential game and uses Pontryagin's maximum principle to organize adversarial updates. Reusing information from a full network pass allows many updates to focus on the first layer, reducing the cost of adversarial training.": "YOPO 将对抗训练表述为微分博弈，并利用庞特里亚金最大值原理组织对抗更新。通过复用完整网络传播的信息，许多更新可以集中在第一层，从而降低对抗训练成本。",
  "Continuous limits and optimization theory": "连续极限与优化理论",
  "I study optimization in deep residual networks through continuous limits and mean field descriptions of their parameters. These tools provide conditions for convergence and clarify how overparameterization from depth changes the training problem.": "我通过连续极限与网络参数的平均场描述，研究深层残差网络的优化。这些工具给出收敛条件，并解释深度过参数化如何改变训练问题。",
  "Deep ResNet mean field analysis": "深层残差网络的平均场分析",
  "Foundations": "数学基础",
  "Mathematics beneath the applications": "应用背后的数学",
  "The applications vary, but the toolkit is intentionally coherent.": "应用场景各异，数学工具相互贯通。",
