  "Monte Carlo, control, and sequential methods that convert additional inference computation into reliable accuracy gains.": "通过蒙特卡洛、控制与序贯方法，将额外的推理计算转化为可靠的精度提升。",
  "Structure preserving learning for PDEs, operator learning, uncertainty quantification, and simulation calibrated correction.": "研究偏微分方程的保结构学习、算子学习、不确定性量化与模拟校准修正。",
  "Width and depth stable optimization geometry, predictable hyperparameter transfer, and robust learning algorithms.": "研究对网络宽度与深度稳定的优化几何、可预测的超参数迁移及鲁棒学习算法。",
