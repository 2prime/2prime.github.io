<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="860" viewBox="0 0 960 860" role="img" aria-labelledby="centered_pool-title centered_pool-desc" lang="en">
  <title id="centered_pool-title">From an opposite pair to K parallel candidates</title>
  <desc id="centered_pool-desc">A pair of opposite directions extends to a pool of five directions summing to zero. Values can be queried in parallel before one candidate is randomly selected.</desc>
  <defs>
    <style>text { font-family: Arial, Helvetica, sans-serif; font-weight: 400; text-rendering: optimizeLegibility; }</style>
    <marker id="arrow-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 Z" fill="#842c36" />
    </marker>
    <marker id="arrow-teal" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 Z" fill="#526b60" />
    </marker>
    <marker id="arrow-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 Z" fill="#4f5551" />
    </marker>
    <marker id="arrow-muted" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 Z" fill="#696b65" />
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="860" fill="#fcfbf8" rx="0" ry="0" />
  <line x1="48" y1="57" x2="86" y2="57" stroke="#842c36" stroke-width="3" stroke-linecap="round" />
  <text x="102" y="65" fill="#842c36" font-size="24" text-anchor="start">05  K PARALLEL CANDIDATES</text>
  <text x="48" y="113" fill="#292a28" font-size="30" text-anchor="start">From an opposite pair to K parallel candidates</text>
  <text x="48" y="157" fill="#4f5551" font-size="23" text-anchor="start">For K = 5, directions balance and values are queried in parallel.</text>
  <rect x="48" y="195" width="282" height="425" fill="#f3f1ec" rx="4" ry="4" />
  <rect x="354" y="195" width="558" height="425" fill="#f3f1ec" rx="4" ry="4" />
  <text x="189" y="237" fill="#4f5551" font-size="24" text-anchor="middle">K = 2: opposite directions</text>
  <text x="633" y="237" fill="#4f5551" font-size="24" text-anchor="middle">K = 5: directions sum to zero</text>
  <line x1="189" y1="400" x2="263" y2="327" stroke="#526b60" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-teal)" />
  <circle cx="263" cy="327" r="8" fill="#fcfbf8" stroke="#526b60" stroke-width="3" />
  <line x1="189" y1="400" x2="115" y2="473" stroke="#526b60" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-teal)" />
  <circle cx="115" cy="473" r="8" fill="#fcfbf8" stroke="#526b60" stroke-width="3" />
  <circle cx="189" cy="400" r="8" fill="#292a28" />
  <text x="169" y="393" fill="#292a28" font-size="30" text-anchor="middle">μ</text>
  <text x="269" y="301" fill="#526b60" font-size="28" text-anchor="middle">H₁</text>
  <text x="109" y="514" fill="#526b60" font-size="28" text-anchor="middle">H₂</text>
  <text x="189" y="593" fill="#4f5551" font-size="28" text-anchor="middle">Z₂ = −Z₁</text>
  <line x1="650" y1="400" x2="800" y2="385" stroke="#526b60" stroke-width="2.7" stroke-linecap="round" marker-end="url(#arrow-teal)" />
  <circle cx="800" cy="385" r="9" fill="#fcfbf8" stroke="#526b60" stroke-width="3" />
  <line x1="650" y1="400" x2="684" y2="278" stroke="#842c36" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrow-red)" />
  <circle cx="684" cy="278" r="9" fill="#842c36" stroke="#842c36" stroke-width="3" />
  <circle cx="684" cy="278" r="17" fill="none" stroke="#842c36" stroke-width="2" />
  <line x1="650" y1="400" x2="534" y2="330" stroke="#526b60" stroke-width="2.7" stroke-linecap="round" marker-end="url(#arrow-teal)" />
  <circle cx="534" cy="330" r="9" fill="#fcfbf8" stroke="#526b60" stroke-width="3" />
  <line x1="650" y1="400" x2="550" y2="483" stroke="#526b60" stroke-width="2.7" stroke-linecap="round" marker-end="url(#arrow-teal)" />
  <circle cx="550" cy="483" r="9" fill="#fcfbf8" stroke="#526b60" stroke-width="3" />
  <line x1="650" y1="400" x2="682" y2="524" stroke="#526b60" stroke-width="2.7" stroke-linecap="round" marker-end="url(#arrow-teal)" />
  <circle cx="682" cy="524" r="9" fill="#fcfbf8" stroke="#526b60" stroke-width="3" />
  <circle cx="650" cy="400" r="8" fill="#292a28" />
  <text x="638" y="441" fill="#292a28" font-size="30" text-anchor="middle">μ</text>
  <text x="835" y="394" fill="#526b60" font-size="28" text-anchor="middle">H₁</text>
  <text x="730" y="281" fill="#842c36" font-size="28" text-anchor="middle">H₂</text>
  <text x="493" y="324" fill="#526b60" font-size="28" text-anchor="middle">H₃</text>
  <text x="511" y="511" fill="#526b60" font-size="28" text-anchor="middle">H₄</text>
  <text x="720" y="550" fill="#526b60" font-size="28" text-anchor="middle">H₅</text>
  <text x="806" y="315" fill="#842c36" font-size="24" text-anchor="middle">Selected</text>
  <text x="633" y="593" fill="#4f5551" font-size="28" text-anchor="middle">Z₁ + ⋯ + Z₅ = 0</text>
  <rect x="48" y="646" width="864" height="117" fill="#f2e9e8" rx="4" ry="4" />
  <text x="480" y="689" fill="#842c36" font-size="24" text-anchor="middle">Query all values Hᵢ in parallel</text>
  <text x="480" y="736" fill="#842c36" font-size="24" text-anchor="middle">Draw one candidate with pᵢ = Hᵢ / ΣⱼHⱼ</text>
  <text x="480" y="805" fill="#4f5551" font-size="23" text-anchor="middle">Dependent within the pool; each Zᵢ is marginally standard Gaussian.</text>
  <text x="480" y="842" fill="#696b65" font-size="23" text-anchor="middle">Arrows illustrate balance; the red point is the selected candidate.</text>
</svg>