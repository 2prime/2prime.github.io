<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="820" viewBox="0 0 960 820" role="img" aria-labelledby="two_queries-title two_queries-desc" lang="en">
  <title id="two_queries-title">Two symmetric candidates form a finite difference</title>
  <desc id="two_queries-desc">Candidates at mu minus 0.1 and mu plus 0.1 have values 9 and 11. Selection probabilities 45% and 55% give an average displacement of 0.01.</desc>
  <defs>
    <style>text { font-family: Arial, Helvetica, sans-serif; font-weight: 400; text-rendering: optimizeLegibility; }</style>
    <marker id="arrow-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 Z" fill="#842c36" />
    </marker>
    <marker id="arrow-teal" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 Z" fill="#526b60" />
    </marker>
    <marker id="arrow-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 Z" fill="#4f5551" />
    </marker>
    <marker id="arrow-muted" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 Z" fill="#696b65" />
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="820" fill="#fcfbf8" rx="0" ry="0" />
  <line x1="48" y1="57" x2="86" y2="57" stroke="#842c36" stroke-width="3" stroke-linecap="round" />
  <text x="102" y="65" fill="#842c36" font-size="24" text-anchor="start">05  FINITE DIFFERENCE WARM UP</text>
  <text x="48" y="113" fill="#292a28" font-size="30" text-anchor="start">Two symmetric candidates form a finite difference</text>
  <text x="48" y="157" fill="#4f5551" font-size="23" text-anchor="start">Compare values and favor the more promising side.</text>
  <text x="184" y="219" fill="#4f5551" font-size="32" text-anchor="middle">H⁻ = 9</text>
  <text x="776" y="219" fill="#842c36" font-size="32" text-anchor="middle">H⁺ = 11</text>
  <text x="480" y="225" fill="#696b65" font-size="24" text-anchor="middle">Value difference: 11 − 9 = 2</text>
  <rect x="82" y="237" width="204" height="44" fill="#f3f1ec" rx="4" ry="4" />
  <rect x="674" y="237" width="204" height="44" fill="#f2e9e8" rx="4" ry="4" />
  <text x="184" y="268" fill="#4f5551" font-size="25" text-anchor="middle">Select with 45%</text>
  <text x="776" y="268" fill="#842c36" font-size="25" text-anchor="middle">Select with 55%</text>
  <line x1="145" y1="323" x2="815" y2="323" stroke="#dedcd5" stroke-width="3" stroke-linecap="round" />
  <circle cx="184" cy="323" r="12" fill="#4f5551" />
  <circle cx="480" cy="323" r="9" fill="#292a28" />
  <circle cx="776" cy="323" r="12" fill="#842c36" />
  <text x="184" y="364" fill="#4f5551" font-size="28" text-anchor="middle">μ − 0.1</text>
  <text x="480" y="364" fill="#292a28" font-size="30" text-anchor="middle">μ</text>
  <text x="776" y="364" fill="#842c36" font-size="28" text-anchor="middle">μ + 0.1</text>
  <line x1="184" y1="397" x2="776" y2="397" stroke="#696b65" stroke-width="2" stroke-linecap="round" />
  <line x1="184" y1="388" x2="184" y2="406" stroke="#696b65" stroke-width="2" stroke-linecap="round" />
  <line x1="776" y1="388" x2="776" y2="406" stroke="#696b65" stroke-width="2" stroke-linecap="round" />
  <text x="480" y="436" fill="#4f5551" font-size="27" text-anchor="middle">Distance: 0.2</text>
  <rect x="48" y="466" width="864" height="120" fill="#f3f1ec" rx="4" ry="4" />
  <text x="264" y="507" fill="#4f5551" font-size="24" text-anchor="middle">Central difference slope</text>
  <text x="264" y="553" fill="#292a28" font-size="31" text-anchor="middle">(11 − 9) / 0.2 = 10</text>
  <line x1="480" y1="485" x2="480" y2="567" stroke="#dedcd5" stroke-width="2" stroke-linecap="round" />
  <text x="696" y="507" fill="#4f5551" font-size="28" text-anchor="middle">Average value</text>
  <text x="696" y="553" fill="#292a28" font-size="31" text-anchor="middle">(11 + 9) / 2 = 10</text>
  <rect x="48" y="612" width="864" height="144" fill="#f2e9e8" rx="4" ry="4" />
  <text x="480" y="650" fill="#842c36" font-size="23" text-anchor="middle">Mean shift = step size squared × slope ÷ mean value</text>
  <text x="480" y="698" fill="#842c36" font-size="36" text-anchor="middle">0.1² × 10 / 10 = 0.01</text>
  <text x="480" y="737" fill="#4f5551" font-size="25" text-anchor="middle">Also: 55% × 0.1 + 45% × (−0.1)</text>
  <text x="480" y="797" fill="#4f5551" font-size="23" text-anchor="middle">Each draw picks one side; 0.01 is the average displacement.</text>
</svg>