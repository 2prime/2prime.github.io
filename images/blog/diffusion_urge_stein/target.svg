<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="650" viewBox="0 0 960 650" role="img" aria-labelledby="target-title target-desc" lang="zh-CN">
  <title id="target-title">从原始生成，到偏好分布</title>
  <desc id="target-desc">教学示例，不是论文实验。只有书和书加电脑的原始概率分别为百分之八十与百分之二十。将它们乘以正偏好权重一与四后，加权质量均为零点八，归一化后两类的目标概率均为百分之五十。</desc>
  <defs>
    <style>text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', 'FandolHei', sans-serif; font-weight: 400; text-rendering: optimizeLegibility; }</style>
    <marker id="arrow-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 Z" fill="#842c36" />
    </marker>
    <marker id="arrow-teal" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 Z" fill="#526b60" />
    </marker>
    <marker id="arrow-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 Z" fill="#4f5551" />
    </marker>
    <marker id="arrow-muted" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 Z" fill="#696b65" />
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="650" fill="#fcfbf8" rx="0" ry="0" />
  <line x1="48" y1="57" x2="86" y2="57" stroke="#842c36" stroke-width="3" stroke-linecap="round" />
  <text x="102" y="65" fill="#842c36" font-size="24" text-anchor="start">01  教学示例</text>
  <text x="48" y="113" fill="#292a28" font-size="34" text-anchor="start">从原始生成，到偏好分布</text>
  <text x="48" y="157" fill="#4f5551" font-size="28" text-anchor="start">先乘正的偏好权重，再把总概率归一化。</text>
  <text x="156" y="211" fill="#696b65" font-size="26" text-anchor="middle">生成结果</text>
  <text x="382" y="211" fill="#696b65" font-size="26" text-anchor="middle">原始概率 p</text>
  <text x="568" y="211" fill="#696b65" font-size="26" text-anchor="middle">偏好权重 φ</text>
  <text x="805" y="211" fill="#696b65" font-size="26" text-anchor="middle">目标概率 π</text>
  <rect x="48" y="234" width="864" height="142" fill="#f3f1ec" rx="4" ry="4" />
  <rect x="48" y="395" width="864" height="142" fill="#f3f1ec" rx="4" ry="4" />
