  <path d="M 122.14 441.64000000000004 Q 131.6 438.2 140.2 439.92" stroke="#4f5551" stroke-width="1.7" fill="none" stroke-linejoin="round" stroke-linecap="round" />
  <path d="M 88.6 448.52 Q 97.2 446.79999999999995 106.66 450.24" stroke="#4f5551" stroke-width="1.7" fill="none" stroke-linejoin="round" stroke-linecap="round" />
  <path d="M 122.14 450.24 Q 131.6 446.79999999999995 140.2 448.52" stroke="#4f5551" stroke-width="1.7" fill="none" stroke-linejoin="round" stroke-linecap="round" />
  <path d="M 88.6 457.12 Q 97.2 455.4 106.66 458.84000000000003" stroke="#4f5551" stroke-width="1.7" fill="none" stroke-linejoin="round" stroke-linecap="round" />
  <path d="M 122.14 458.84000000000003 Q 131.6 455.4 140.2 457.12" stroke="#4f5551" stroke-width="1.7" fill="none" stroke-linejoin="round" stroke-linecap="round" />
