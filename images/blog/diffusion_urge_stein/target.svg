  <line x1="653" y1="308" x2="701" y2="308" stroke="#696b65" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow-muted)" />
  <text x="805" y="321" fill="#842c36" font-size="40" text-anchor="middle">50%</text>
  <text x="382" y="482" fill="#4f5551" font-size="40" text-anchor="middle">20%</text>
  <text x="469" y="479" fill="#696b65" font-size="32" text-anchor="middle">×</text>
  <text x="568" y="482" fill="#842c36" font-size="40" text-anchor="middle">4</text>
  <line x1="653" y1="469" x2="701" y2="469" stroke="#696b65" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow-muted)" />
  <text x="805" y="482" fill="#842c36" font-size="40" text-anchor="middle">50%</text>
  <text x="480" y="588" fill="#292a28" font-size="32" text-anchor="middle">0.8 × 1 = 0.2 × 4 = 0.8</text>
  <text x="480" y="627" fill="#4f5551" font-size="26" text-anchor="middle">两类加权质量相同，归一化后各占 50%。</text>
</svg>