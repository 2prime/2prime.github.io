  <text x="156" y="514" fill="#292a28" font-size="28" text-anchor="middle">书和电脑</text>
  <text x="382" y="321" fill="#4f5551" font-size="40" text-anchor="middle">80%</text>
  <text x="469" y="318" fill="#696b65" font-size="32" text-anchor="middle">×</text>
