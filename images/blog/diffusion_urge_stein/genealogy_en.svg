<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="670" viewBox="0 0 960 670" role="img" aria-labelledby="genealogy-title genealogy-desc" lang="en">
  <title id="genealogy-title">More particles can still share the same history</title>
  <desc id="genealogy-desc">On the left, repeated resampling keeps four particles but reduces four ancestral families to two and then one. Descendants share a prefix and can add independent future noise. On the right, four complete proposals use independent randomness. Consecutive outputs of a later MH chain can still be correlated.</desc>
