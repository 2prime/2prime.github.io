<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="670" viewBox="0 0 960 670" role="img" aria-labelledby="genealogy-title genealogy-desc" lang="zh-CN">
  <title id="genealogy-title">粒子很多，不等于独立的信息很多</title>
  <desc id="genealogy-desc">左图反复重采样仍保留四个粒子，但祖先家族由四个变成两个再变成一个。分支共享已生成的前缀，复制后的后续噪声仍然可以独立。右图四条完整提议由各自独立随机性生成，分别标记 A、B、C、D。独立性只指提议轨迹，后续的 MH 链输出仍然可能相关。</desc>
